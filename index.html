und:#102b18;color:var(--green);border-radius:999px;padding:7px 11px;cursor:pointer;font-weight:700}@media(max-width:800px){.visual-motif{width:130px;right:4%;top:4%;opacity:.35}}</style></head><body><div class="app"><header class="top"><div class="brand">ECOLIDERAZGO · UAGRM</div><div class="tools"><button id="navBtn">☰ Navegación</button><button id="fullBtn">⛶ Pantalla completa</button><button id="soundBtn">🌲 Sonido</button><input id="volume" type="range" min="0" max="100" value="35" aria-label="Volumen"></div></header><div class="progress"><i id="bar"></i></div><nav class="nav" id="nav"><h2>Contenido de la presentación</h2><div id="navList"></div></nav><main id="deck"></main><footer class="bottom"><button id="prev">← Anterior</button><span id="status">Usa el botón de navegación o las flechas</span><button id="next">Siguiente →</button></footer></div><div class="modal" id="modal"><div class="modalbox"><button id="close">×</button><h2 id="modalTitle"></h2><p id="modalText"></p></div></div><script>
const screens=[
['Pantalla previa de espera','Preparación del equipo expositor','Esta pantalla puede permanecer proyectada mientras se conecta el equipo, se verifica el audio y se organiza la exposición. La activación requiere una acción del usuario.','Espera','HTML original · pantalla splash'],
['Portada institucional','Ecoliderazgo y manejo de conflictos','Universidad Autónoma Gabriel René Moreno · Facultad de Humanidades · Ciencias de la Educación · Taller de Educación Ambiental · Gestión II/2026.','Portada','HTML original · portada institucional'],
['Inicio y controles de presentación','Liderar · dialogar · transformar','La experiencia combina lectura visual, navegación temática, elementos animados, paneles de profundización y audio ambiental.','Interfaz','Estructura de presentación'],
['Propósito y problema de investigación','Las decisiones ambientales también son decisiones sociales','Agua, territorio, energía, producción e infraestructura implican intereses diversos, instituciones, relaciones de poder y expectativas sociales. El ecoliderazgo permite analizar cómo se orientan esas decisiones hacia la sostenibilidad y cómo se procesan los desacuerdos.','Problema','Introducción; PNUD 2026c–d'],
['Pregunta orientadora y enfoque documental','Comprender antes de intervenir','El informe pregunta cómo relacionar el cuidado de los sistemas naturales con la participación, las necesidades sociales y la continuidad de los acuerdos. La revisión científica organiza conceptos; las guías aportan herramientas; el estudio territorial ofrece un contexto, no una prueba universal.','Método','Introducción metodológica'],
['Liderazgo contemporáneo','Liderar no equivale a ocupar una posición','El liderazgo es un proceso de orientación, influencia y coordinación. Su calidad depende de la capacidad de construir objetivos compartidos, movilizar conocimientos distribuidos y generar condiciones para la responsabilidad colectiva.','Concepto','Algharabli et al. (2026); UNESCO y OEI (2025)'],
['Autoridad formal y capacidad de liderazgo','La posición no garantiza credibilidad','La autoridad formal nace de una función reconocida; la capacidad de liderazgo se construye mediante comprensión del problema, escucha, coherencia y coordinación. Pueden coincidir, pero no son equivalentes.','Caso','Sección 1.1 del informe'],
['Liderazgo distribuido y responsabilidad colectiva','Compartir decisiones exige organización','Distribuir liderazgo no significa repartir tareas sin coordinación. Requiere mecanismos colegiados, empoderamiento, claridad de responsabilidades y condiciones para que la experiencia de distintos actores influya en la decisión.','Diagrama','UNESCO y OEI (2025)'],
['Sostenibilidad y responsabilidad intergeneracional','Decidir hoy considerando efectos futuros','La sostenibilidad integra dimensiones ambientales, sociales y económicas. Una decisión responsable debe revisar consecuencias directas, indirectas, distribución de costos y capacidades que quedan disponibles para las generaciones siguientes.','Comparación','Algharabli et al. (2026); PNUD (2026c)'],
['Competencias del liderazgo sostenible','Pensar sistemas, colaborar y adaptarse','El liderazgo sostenible necesita ética, custodia responsable, pensamiento sistémico, comunicación, deliberación, empoderamiento, resiliencia y capacidad de revisar estrategias ante nueva evidencia.','Tarjetas','Secciones 1.2 y 1.3'],
['Concepto y alcance del ecoliderazgo','Una construcción analítica integradora','El informe utiliza ecoliderazgo para integrar liderazgo sostenible, custodia ambiental, responsabilidad social, gobernanza, participación significativa y capacidad de prevenir o transformar conflictos. No se presenta como definición científica única.','Definición','Sección 2.1; Algharabli et al. (2026); PNUD (2026c)'],
['Niveles personal, colectivo e institucional','La continuidad depende de los tres niveles','En el nivel personal importa la coherencia; en el colectivo, la cooperación y los objetivos compartidos; en el institucional, las reglas, procedimientos, información y recursos que permiten sostener las prácticas más allá de una persona.','Capas','Sección 2.1'],
['Ecoliderazgo comunitario','Organizar capacidades desde el territorio','La comunidad no es homogénea. El ecoliderazgo comunitario requiere circulación de información, reconocimiento de saberes, representación responsable, confianza, rendición de cuentas y capacidad de relacionarse con instituciones externas.','Mapa','Sección 2.2; Manik et al. (2026)'],
['Gobernanza ambiental','Decidir dentro de relaciones de poder','Las decisiones dependen de actores, intereses, incentivos, instituciones formales e informales, capacidades y relaciones de poder. La gobernanza legítima reconoce aportes y límites de cada participante.','Actores','PNUD 2026c; Manik et al. (2026)'],
['Participación socioambiental significativa','Participar es poder incidir','La participación requiere información comprensible, acceso, representación, deliberación antes del cierre de decisiones, capacidad de incidencia y devolución de respuestas. Asistir a una reunión no demuestra por sí solo influencia.','Semáforo','CEPAL 2026; sección 2.3'],
['Actores, intereses y relaciones de poder','Quién decide, quién influye y quién recibe efectos','El análisis distingue actores afectados, decisores, influyentes y excluidos. También revisa recursos económicos, institucionales, informativos, territoriales y simbólicos.','Matriz','PNUD 2026c; Manik et al. (2026)'],
['Concepto y dinámica del conflicto','El desacuerdo no equivale automáticamente a violencia','El conflicto es dinámico: posee antecedentes, causas, detonantes, posiciones, percepciones, escaladas y oportunidades de transformación. Analizarlo temprano evita responder solo a la manifestación visible.','Línea de tiempo','Sección 3.1; PNUD 2026b'],
['Posiciones, intereses, necesidades y temores','Leer lo visible y lo subyacente','La posición es la demanda expresada; el interés es la preocupación; la necesidad es una condición fundamental; el temor es un riesgo percibido. Esta distinción mejora la escucha y evita simplificaciones.','Capas','Sección 3.2; PNUD 2026b'],
['Análisis de actores y recursos de poder','Las asimetrías condicionan la cooperación','La cooperación puede debilitarse cuando actores con mayor capacidad institucional o económica imponen su perspectiva. El diagnóstico debe reconocer dependencias, barreras de participación y recursos de incidencia.','Tablero','PNUD 2026b–c; Manik et al. (2026)'],
['Prevención y alerta temprana','Observar, verificar, analizar y responder','La alerta temprana organiza información para apoyar decisiones preventivas. Requiere registrar demandas, contrastar señales, analizar riesgos y revisar los efectos de la respuesta. No es una predicción infalible.','Flujo','PNUD 2026b; SIMAT'],
['Diálogo, negociación, mediación y conciliación','El mecanismo depende del contexto','El diálogo puede abrir comprensión; la negociación busca acuerdos; la mediación incorpora asistencia de un tercero; la conciliación debe entenderse según su alcance y contexto. Ningún mecanismo sirve automáticamente para todos los casos.','Selector','PNUD 2026b; sección 3.4'],
['Derechos humanos y Acción sin Daño','Intervenir sin profundizar desigualdades','Toda intervención debe revisar derechos, no discriminación, transparencia, participación, protección de actores vulnerables y posibles efectos no intencionados. Una solución técnica no justifica ignorar daños sociales.','Lista','PNUD 2026b; sección 3.5'],
['Conflictos socioambientales y territorio','Ambiente, recursos y relaciones sociales','Los conflictos socioambientales articulan recursos naturales, medios de vida, derechos, actividades económicas, instituciones y formas de pertenencia. Una modificación ambiental puede redistribuir costos, beneficios, acceso y riesgos.','Mapa','Manik et al. (2026); PNUD 2026d'],
['Justicia socioecológica y cohesión social','Reconocimiento, representación y distribución','Una respuesta justa debe preguntar quién es reconocido, quién participa en la decisión y cómo se distribuyen costos y beneficios. La confianza y la cohesión social dependen también de esas condiciones.','Evaluación','Manik et al. (2026); PNUD 2026a'],
['Bolivia y Santa Cruz','Interpretar el contexto con límites','El informe relaciona pertenencia territorial, cohesión social y confianza institucional. Los datos corresponden al ámbito y periodo del estudio citado; un índice no equivale automáticamente a un porcentaje de personas ni demuestra causalidad.','Datos','PNUD 2026a'],
['Aplicación integradora','Un caso hipotético para conectar el aprendizaje','Una propuesta responsable debe identificar actores, posiciones, intereses, necesidades, temores, relaciones de poder, derechos, alternativas, mecanismo de diálogo, responsables, plazos, indicadores y revisión. El caso es explicativo, no evidencia de un conflicto observado.','Caso','Módulo 8; conclusiones del informe'],
['Conclusiones','Cinco capacidades para un ecoliderazgo coherente','Visión sostenible, pensamiento sistémico, participación significativa, lectura de relaciones de poder, diálogo y seguimiento. El ecoliderazgo no sustituye a las partes: crea condiciones para decisiones responsables y acuerdos revisables.','Síntesis','Conclusiones del informe'],

(function(){
  const content=[
    {devTitle:'Ruta de aprendizaje',devText:'La presentación organiza el informe como un recorrido: parte del liderazgo y la sostenibilidad, delimita el ecoliderazgo, analiza la gestión constructiva de conflictos y finalmente integra ambos campos en los conflictos socioambientales.',deepTitle:'Cómo leer el recorrido',deepText:'Cada pantalla desarrolla una idea y la conecta con la siguiente. La navegación permite volver a un concepto, contrastarlo con el análisis de conflictos y usar la profundización para distinguir evidencia del informe, interpretación y aplicación.',synthesis:'Comprender el ecoliderazgo exige recorrer conceptos, relaciones y decisiones, no solo memorizar definiciones.'},
    {devTitle:'Problema socioambiental',devText:'Las decisiones sobre agua, territorio, energía, producción e infraestructura afectan al mismo tiempo a ecosistemas, comunidades, instituciones y actividades económicas. El informe estudia cómo orientar esas decisiones hacia la sostenibilidad y cómo procesar los desacuerdos que generan.',deepTitle:'Por qué no basta una respuesta técnica',deepText:'Una solución ambiental puede distribuir costos, beneficios y riesgos de manera desigual. Por eso es necesario preguntar quién decide, quién recibe los efectos, quién posee capacidad de incidencia y qué instituciones pueden construir legitimidad (PNUD, 2026c–d).',synthesis:'La sostenibilidad ambiental también depende de la calidad social y política de las decisiones.'},
    {devTitle:'Enfoque del informe',devText:'El informe integra revisión científica reciente y marcos institucionales. Algharabli et al. revisan 145 artículos sobre liderazgo sostenible; Manik et al. analizan 58 estudios seleccionados de 3.099 registros; el PNUD aporta guías sobre gobernanza, conflictos, cohesión y acción climática.',deepTitle:'Alcance y límites de la evidencia',deepText:'Cada fuente cumple una función distinta: la literatura organiza conceptos, las guías aportan herramientas y el estudio de Santa Cruz ofrece un contexto empírico situado. Esta diferencia evita presentar un caso territorial como prueba universal o convertir un índice en una explicación causal.',synthesis:'La argumentación combina conceptos, herramientas y evidencia contextual sin confundir sus alcances.'},
    {devTitle:'Liderazgo como proceso',devText:'Las concepciones contemporáneas entienden el liderazgo como un proceso de orientación, influencia y coordinación. Su valor no depende solo de una posición jerárquica, sino de la capacidad de construir objetivos compartidos y movilizar conocimientos distribuidos (UNESCO y OEI, 2025).',deepTitle:'De la obediencia a la capacidad colectiva',deepText:'Un liderazgo de calidad se reconoce por los procesos que genera: confianza, aprendizaje, colaboración, responsabilidad y continuidad. Dirigir no significa concentrar todas las respuestas, sino crear condiciones para que distintas capacidades se conviertan en acción colectiva.',synthesis:'Liderar es orientar y coordinar capacidades para alcanzar propósitos compartidos.'},
    {devTitle:'Autoridad y credibilidad',devText:'La autoridad formal proviene de una función reconocida, mientras que la capacidad de liderazgo se construye mediante comprensión del problema, escucha, coherencia y coordinación. Ambas pueden coincidir, pero ninguna posición garantiza por sí sola confianza o legitimidad.',deepTitle:'Qué sostiene la legitimidad',deepText:'En un proceso socioambiental, la autoridad puede convocar y establecer procedimientos, pero la credibilidad depende de cómo se escucha, se explica la información y se cumplen los compromisos. La legitimidad se fortalece cuando las decisiones pueden justificarse y revisarse.',synthesis:'La posición abre una responsabilidad; la credibilidad se construye en la relación con los actores.'},
    {devTitle:'Condiciones del liderazgo distribuido',devText:'Distribuir el liderazgo no equivale a repartir tareas sin coordinación. Requiere mecanismos colegiados, participación, empoderamiento, claridad de responsabilidades y condiciones para que la experiencia de diferentes actores influya en la decisión (UNESCO y OEI, 2025).',deepTitle:'Responsabilidad colectiva organizada',deepText:'La distribución funciona cuando existen reglas para decidir, canales para compartir información y reconocimiento de los saberes del territorio. Sin estas condiciones, la participación puede convertirse en una suma de opiniones sin incidencia o en una delegación informal de responsabilidades.',synthesis:'La responsabilidad compartida necesita organización, reglas y capacidad real de incidencia.'},
    {devTitle:'Horizonte de sostenibilidad',devText:'El liderazgo sostenible incorpora las consecuencias ambientales, sociales y económicas de las decisiones. No trata la sostenibilidad como un tema adicional, sino como un horizonte que modifica la manera de valorar resultados, riesgos, equidad, resiliencia y permanencia.',deepTitle:'Custodia y responsabilidad intergeneracional',deepText:'La custodia responsable implica preservar recursos y bienestar humano y ecológico a largo plazo (Algharabli et al., 2026). Una decisión puede parecer eficiente hoy, pero ser insostenible si traslada costos al futuro o a grupos con menor capacidad de influencia.',synthesis:'Decidir sosteniblemente significa ampliar el criterio de éxito hacia el futuro y hacia quienes reciben los efectos.'},
    {devTitle:'Capacidades del liderazgo sostenible',devText:'La revisión del informe reúne adaptabilidad, colaboración, empoderamiento, conciencia ambiental, ética, visión de largo plazo, resiliencia, pensamiento estratégico y custodia responsable. Estas capacidades deben expresarse en prácticas y estructuras, no solo en cualidades personales.',deepTitle:'Pensamiento sistémico y adaptación',deepText:'El pensamiento sistémico relaciona actores, intereses, incentivos, instituciones, recursos y poder. La adaptabilidad permite revisar estrategias frente a nueva evidencia sin abandonar los principios de responsabilidad ambiental, equidad y protección de derechos.',synthesis:'El liderazgo sostenible combina ética firme con estrategias capaces de aprender y ajustarse.'},
    {devTitle:'Definición de trabajo',devText:'El informe utiliza ecoliderazgo como una construcción analítica integradora: liderazgo individual, colectivo o institucional que incorpora custodia ambiental, responsabilidad social, visión de largo plazo, participación significativa y capacidad de prevenir o transformar conflictos.',deepTitle:'Alcance y límites del concepto',deepText:'El término no posee una definición científica única y universalmente aceptada. Por eso se delimita mediante categorías respaldadas por la literatura: liderazgo sostenible, gobernanza, participación, responsabilidad social y gestión constructiva de conflictos.',synthesis:'El ecoliderazgo articula categorías existentes para comprender decisiones ambientales responsables y legítimas.'},
    {devTitle:'Tres niveles de acción',devText:'El ecoliderazgo opera en tres niveles relacionados. En el personal requiere coherencia ética y aprendizaje; en el colectivo, cooperación, conocimiento compartido y objetivos comunes; en el institucional, reglas, información, procedimientos y recursos que sostengan las prácticas.',deepTitle:'De la persona a la institución',deepText:'Una iniciativa depende menos de una figura cuando se convierte en procedimiento, capacidad y memoria organizativa. La continuidad exige que las decisiones sostenibles sobrevivan a los cambios de autoridades o participantes y puedan ser evaluadas y mejoradas.',synthesis:'La coherencia personal inicia el cambio, pero las estructuras permiten sostenerlo.'},
    {devTitle:'Capacidad desde el territorio',devText:'El ecoliderazgo comunitario se construye mediante cooperación entre personas, organizaciones e instituciones del territorio. Requiere circulación de información, reconocimiento de saberes, representación responsable, confianza, rendición de cuentas y capacidad de relacionarse con actores externos.',deepTitle:'Organización interna y articulación externa',deepText:'Una comunidad no es homogénea. El liderazgo debe fortalecer prioridades y confianza dentro del colectivo, y al mismo tiempo facilitar relaciones con instituciones, organizaciones técnicas y empresas sin borrar las diferencias de intereses.',synthesis:'La acción comunitaria se fortalece cuando organiza capacidades internas y negocia responsablemente hacia afuera.'},
    {devTitle:'Mapa de gobernanza',devText:'La gobernanza ambiental reúne actores, intereses, incentivos, instituciones formales e informales, capacidades y relaciones de poder. Las decisiones no dependen solo de una norma: también de prácticas locales, confianza, reputación y formas históricas de organización (PNUD, 2026c).',deepTitle:'Instituciones y relaciones de poder',deepText:'Una intervención técnicamente correcta puede ser inviable si desconoce quién influye, qué recursos posee cada actor y qué reglas condicionan la interacción. El ecoliderazgo hace visibles esas relaciones para ampliar el espacio de cooperación y legitimidad.',synthesis:'Gobernar ambientalmente es ordenar relaciones de decisión, no solo administrar recursos.'},
    {devTitle:'Participación significativa',devText:'La participación ambiental requiere información comprensible, acceso, representación, deliberación oportuna, capacidad de incidencia y devolución de respuestas. Asistir a una reunión no demuestra por sí solo que exista participación con influencia real (CEPAL, 2026).',deepTitle:'Información, oportunidad y representación',deepText:'Consultar cuando las decisiones ya están cerradas limita la incidencia. También puede excluir a quienes tienen menos tiempo, información o acceso institucional. Un proceso legítimo incorpora a los actores antes de definir completamente el problema y las alternativas.',synthesis:'Participar significa poder comprender, deliberar e influir cuando todavía es posible modificar la decisión.'},
    {devTitle:'Lectura de actores',devText:'El análisis distingue actores afectados, decisores, influyentes y excluidos. También observa recursos económicos, institucionales, informativos, territoriales y simbólicos, porque cada recurso modifica la capacidad de incidir en la decisión.',deepTitle:'Capacidad de incidencia',deepText:'La representación formal de un actor no garantiza que pueda influir. El diagnóstico debe identificar dependencias, barreras de acceso y relaciones entre quienes reciben efectos y quienes controlan respuestas. Esta lectura evita tratar como iguales a posiciones con poderes muy diferentes.',synthesis:'Conocer a los actores implica analizar sus relaciones, recursos y posibilidades reales de decisión.'},
    {devTitle:'Conflicto como proceso',devText:'El conflicto es dinámico: cambia con las demandas, decisiones, percepciones, actores y acontecimientos. La gestión constructiva comienza antes de la crisis, registrando señales y comprendiendo causas para conservar margen de prevención (PNUD, 2026b).',deepTitle:'De la demanda a la escalada',deepText:'No toda demanda conduce a una crisis, pero su desconocimiento puede reducir las posibilidades de respuesta temprana. La intervención constructiva distingue entre resolver un asunto, manejar una tensión, transformar una relación o prevenir violencia.',synthesis:'El conflicto no se explica solo por su manifestación final; necesita una lectura de antecedentes y evolución.'},
    {devTitle:'Capas del desacuerdo',devText:'La posición expresa lo que una parte pide; el interés muestra la preocupación que la orienta; la necesidad señala una condición considerada esencial; y el temor representa un riesgo percibido. Distinguir estas capas mejora la escucha y amplía las opciones.',deepTitle:'Percepciones y confianza',deepText:'Las partes pueden interpretar de forma distinta un mismo hecho, especialmente cuando existe una historia de desconfianza. Una percepción de exclusión puede reflejar experiencias reales de falta de reconocimiento. Por eso el análisis debe atender hechos, significados y relaciones.',synthesis:'Pasar de las posiciones a intereses, necesidades y temores permite comprender qué sostiene el desacuerdo.'},
    {devTitle:'Poder y asimetrías',devText:'El diagnóstico de actores debe observar quién demanda, quién puede responder, quién recibe beneficios o daños, quién influye indirectamente y qué recursos de poder posee. En conflictos socioambientales, instituciones, comunidades, empresas y especialistas suelen tener capacidades desiguales.',deepTitle:'Un diagnóstico no neutral',deepText:'La cooperación se debilita cuando un actor con mayor capacidad económica o institucional impone su perspectiva. Reconocer la asimetría no significa tomar partido sin análisis; significa crear condiciones de información, representación y reglas que eviten que el acuerdo sea solo una imposición.',synthesis:'El manejo constructivo requiere equilibrar oportunidades de incidencia, no fingir que las relaciones son simétricas.'},
    {devTitle:'Alerta temprana',devText:'La prevención utiliza información para registrar demandas, conflictos y acuerdos, identificar señales de escalada y apoyar decisiones antes de que aumente la confrontación. El SIMAT organiza este proceso con enfoque de derechos humanos (PNUD, 2026b).',deepTitle:'Herramientas preventivas',deepText:'El árbol del conflicto ayuda a distinguir causas y efectos; la matriz de necesidades y temores organiza la lectura de actores; el mapeo muestra influencia y relaciones; y el análisis causal permite ubicar puntos de escalada o contención.',synthesis:'Prevenir no es adivinar el futuro: es observar, verificar, analizar y actuar antes de que se cierre el margen de diálogo.'},
    {devTitle:'Mecanismos de diálogo',devText:'El diálogo puede restablecer comunicación y comprensión; la negociación busca decisiones y acuerdos; la mediación incorpora un tercero facilitador; y la conciliación se entiende según el alcance del caso. Los mecanismos se combinan de acuerdo con el contexto.',deepTitle:'Preparación y equilibrio',deepText:'Antes de convocar, se deben comprender actores, intereses, necesidades, riesgos y relaciones de poder. Las reglas de intercambio, la comunicación no violenta y la información confiable protegen el proceso, especialmente cuando la comunicación directa resulta insuficiente.',synthesis:'No existe un mecanismo automático: su pertinencia depende del tipo de conflicto y de las condiciones de participación.'},
    {devTitle:'Acción sin Daño',devText:'Toda intervención modifica el contexto y puede producir efectos positivos o negativos no previstos. El enfoque de Acción sin Daño exige identificar la dinámica del conflicto, evaluar impactos intencionados y no intencionados y orientar la respuesta con información contextual y oportuna.',deepTitle:'Límites de la intervención',deepText:'Prevenir la escalada no justifica silenciar demandas, excluir actores o vulnerar derechos. Revisar una medida, cambiar su ritmo u ofrecer una consulta puede expresar responsabilidad institucional cuando la decisión se apoya en evidencia y busca reducir daños.',synthesis:'El liderazgo responsable cuida el ambiente y también las relaciones sociales que hacen posible la transformación.'},
    {devTitle:'Conflicto socioambiental',devText:'Estos conflictos aparecen en la intersección entre ambiente y relaciones sociales, económicas, políticas y culturales. Pueden involucrar agua, tierra, conservación, medios de vida, actividades productivas, identidad territorial, derechos y capacidad de participar.',deepTitle:'Sostenibilidad y distribución',deepText:'Un cambio ambiental no produce automáticamente conflicto. Sus efectos dependen de instituciones, distribución de recursos, capacidad de adaptación, relaciones previas y mecanismos legítimos de decisión. La sostenibilidad puede ser objeto de disputa y también horizonte para transformarla.',synthesis:'El ecoliderazgo articula límites ecológicos, impactos sociales y decisiones legítimas de largo plazo.'},
    {devTitle:'Tres dimensiones de justicia',devText:'La justicia socioecológica exige observar reconocimiento, representación y distribución. Una respuesta ambientalmente justa pregunta quién es reconocido, quién participa y cómo se distribuyen costos, beneficios, riesgos y restricciones (Manik et al., 2026).',deepTitle:'Cohesión y confianza',deepText:'La confianza favorece cooperación, pero no sustituye reglas. Puede construirse mediante transparencia, representación, cumplimiento de compromisos y reconocimiento de diferencias. La cohesión social debe incluir pertenencia sin borrar diversidad, derechos ni desigualdades.',synthesis:'La legitimidad de una decisión depende tanto de su resultado como de las relaciones que la sostienen.'},
    {devTitle:'Evidencia de Santa Cruz',devText:'El estudio del PNUD sobre la Región Metropolitana de Santa Cruz analiza inclusión, gobernanza y pertenencia en diez municipios, con información de 1.300 hogares, más de 4.700 personas y 35 indicadores.',deepTitle:'Implicaciones para el ecoliderazgo',deepText:'El índice de cohesión social reportado es 43,34 %, la confianza institucional 22,87 % y el sentido de pertenencia 78,97 %. Estos datos corresponden al ámbito y periodo del estudio: muestran una identidad territorial fuerte junto con una brecha importante de confianza.',synthesis:'En Santa Cruz, la pertenencia puede movilizar cooperación, pero la continuidad exige transparencia, participación y cumplimiento institucional.'},
    {devTitle:'Ruta de aplicación',devText:'Una propuesta socioambiental responsable identifica actores, posiciones, intereses, necesidades, temores, relaciones de poder, derechos, alternativas, mecanismo de diálogo, responsables, plazos, indicadores y formas de revisión.',deepTitle:'Del diagnóstico al seguimiento',deepText:'La aplicación comienza con información y escucha, continúa con análisis de causas y asimetrías, y avanza hacia acuerdos revisables. El seguimiento permite verificar compromisos, corregir efectos no previstos y aprender qué señales fueron ignoradas.',synthesis:'Aplicar el ecoliderazgo es conectar diagnóstico, decisión, responsabilidad y aprendizaje posterior.'},
    {devTitle:'Cinco capacidades integradas',devText:'Las conclusiones reúnen cinco capacidades: visión sostenible de largo plazo, pensamiento sistémico, participación significativa, sensibilidad frente a relaciones de poder y uso constructivo del diálogo y la negociación.',deepTitle:'Criterio de coherencia',deepText:'El ecoliderazgo no elimina todo conflicto ni sustituye a las partes. Crea condiciones para decisiones responsables, protección de derechos y acuerdos revisables. Su coherencia se evalúa por la relación entre principios, procedimientos, efectos y capacidad de aprender.',synthesis:'Cuidar el ambiente y sostener la convivencia exige integrar ética, análisis, participación, diálogo y seguimiento.'}
  ];
  const slides=[...document.querySelectorAll('.slide')];
  content.forEach((item,i)=>{
    const slide=slides[i+2];
    if(!slide)return;
    slide.classList.add('content-developed');
    const cards=slide.querySelectorAll('.card');
    if(cards[0]){cards[0].querySelector('h3').textContent=item.devTitle;cards[0].querySelector('p').textContent=item.devText}
    if(cards[2]){cards[2].querySelector('h3').textContent=item.deepTitle;cards[2].querySelector('p').textContent=item.deepText}
    const detail=slide.querySelector('.detail');
    if(detail){
      const strong=detail.querySelector('strong');
      if(strong)strong.textContent='Síntesis:';
      const more=detail.querySelector('.more');
      if(more){more.textContent='+';more.setAttribute('aria-label','Abrir profundización: '+item.deepTitle);more.dataset.title=item.deepTitle;more.dataset.text=item.deepText+'\n\n'+item.devText+'\n\n'+item.synthesis}
      const text=detail.childNodes[1];
      if(text)text.textContent=' '+item.synthesis;
    }
  });
})();

  const style = document.createElement('style');
  style.id = 'eco-scene-interaction-style';
  style.textContent = `

  // Cada destino es una figura o una etiqueta original. No se generan áreas de clic.
  function targetsFor(svg, sceneIndex) {
    const q = selector => svg.querySelector(selector);
    const c = (x,y) => {
      const circles=Array.from(svg.querySelectorAll('circle[cx="'+x+'"][cy="'+y+'"]'));
      return circles.find(el=>el.matches('.scene-node,.scene-node-cyan'))||circles[0];
    };
    const text = value => Array.from(svg.querySelectorAll('text,tspan')).find(e=>e.textContent.trim()===value);
    const path = value => Array.from(svg.querySelectorAll('path')).find(e=>e.getAttribute('d')===value);
    const group = (x,y) => c(x,y)?.closest('g.scene-float');
    const person = transform => q('g[transform="'+transform+'"]');
    if (sceneIndex === 0) return [
      [person('translate(315 220)')],
      [person('translate(112 300)')],
      [person('translate(520 302)'),path('M211 325Q313 281 414 325'),path('M215 355Q313 405 410 355')]
    ];
    if (sceneIndex === 1) return [
      [group(120,82)],[group(132,270)],[group(465,82)],[group(468,270)]
    ];
    if (sceneIndex === 2) {
      // La etiqueta compartida se divide en dos fragmentos con el mismo texto visible.
      const label=text('herramientas · contexto');
      if (label) {
        const tools=document.createElementNS(SVG,'tspan');tools.textContent='herramientas';
        const context=document.createElementNS(SVG,'tspan');context.textContent='contexto';
        label.replaceChildren(tools,document.createTextNode(' · '),context);
      }
      return [
        [q('g.scene-float'),text('literatura')],
        [q('g.scene-spin-rev'),text('herramientas')],

      ];

      [c(150,255),text('influye')],[c(450,255),text('aprende')]
    ];

      [q('rect[x="108"]'),q('rect[x="130"]'),path('M164 128V82M140 92H188'),text('función formal')],
      [c(506,85),path('M390 245 Q430 105 506 85'),text('credibilidad')],

    ];

    if (sceneIndex === 9) return [

  function bindScene(slide, svg, caption, actions, screenIndex, sequential) {
    if (!svg || !caption || svg.dataset.preciseInteractions) return;
    const targets=targetsFor(svg,screenIndex-2);
    if (targets.length !== actions.length || targets.some(list=>!list[0])) {
      throw new Error('Falta vincular una figura en la pantalla '+screenIndex);
    }
    const originalCaption = caption.textContent;
    const initialText = originalCaption + ' Selecciona una figura o su etiqueta.';
    caption.textContent = initialText;
    caption.id = 'eco-scene-caption-' + screenIndex;
    caption.setAttribute('role', 'status');
    caption.setAttribute('aria-live', 'polite');
    caption.setAttribute('aria-atomic', 'true');
    svg.removeAttribute('aria-hidden');
    svg.setAttribute('role', 'group');
    svg.setAttribute('aria-describedby', caption.id);
    svg.classList.add('eco-interactive-svg');
    svg.dataset.preciseInteractions='true';
    let current = -1;
    const controls = [];

    function restore() {
      current = -1;
      controls.forEach((control,index) => {
        control.setAttribute('aria-pressed','false');
        targets[index].filter(Boolean).forEach(target=>target.classList.remove('eco-selected','eco-completed'));
      });
      caption.textContent = initialText;
      delete slide.dataset.sceneSelection;
    }

    function activate(index) {
      current = index;
      controls.forEach((control,j) => {
        control.setAttribute('aria-pressed', String(j === index));
        targets[j].filter(Boolean).forEach(target=>{
          target.classList.toggle('eco-selected',j===index);
          target.classList.toggle('eco-completed',Boolean(sequential&&j<index));
        });
      });
      const label = document.createElement('strong');
      label.textContent = (sequential ? (index+1)+'/'+actions.length+' · ' : '') + actions[index].label + ': ';
      caption.replaceChildren(label, document.createTextNode(actions[index].text));
      slide.dataset.sceneSelection = actions[index].label;
    }

    actions.forEach((action,index) => {
      const control = targets[index][0];
      control.classList.add('eco-hotspot');
      Object.entries({role:'button',tabindex:'0','aria-label':action.label,'aria-pressed':'false','aria-controls':caption.id,'data-action':index}).forEach(([k,v])=>control.setAttribute(k,String(v)));
      const title = document.createElementNS(SVG,'title');
      title.textContent = action.label;
      // En etiquetas de texto, title se expresa como atributo para no alterar sus glifos.
      if (control.matches('text,tspan')) control.setAttribute('title',action.label);
      else control.appendChild(title);
      targets[index].filter(Boolean).forEach(target=>{
        target.classList.add('eco-target');
        target.dataset.ecoAction=String(index);
        target.setAttribute('data-eco-label',action.label);
        target.addEventListener('click', event => {
          event.stopPropagation();
          if (current === index) restore(); else activate(index);
        });
        target.addEventListener('pointerenter',()=>targets[index].filter(Boolean).forEach(el=>el.classList.add('eco-hover')));
        target.addEventListener('pointerleave',()=>targets[index].filter(Boolean).forEach(el=>el.classList.remove('eco-hover')));
      });
      control.addEventListener('keydown', event => {
        const keys=['Enter',' ','Escape','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'];
        if (!keys.includes(event.key)) return;
        event.preventDefault();
        event.stopPropagation();
        if (event.key === 'Escape') return restore();
        if (event.key === 'Enter' || event.key === ' ') {
          if (current === index) restore(); else activate(index);
          return;
        }
        let next = index;
        if (event.key === 'Home') next=0;
        else if(event.key === 'End') next=actions.length-1;
        else next=(index+(['ArrowLeft','ArrowUp'].includes(event.key)?-1:1)+actions.length)%actions.length;
        controls[next].focus();
        activate(next);
      });
      controls.push(control);
    });
    slide.dataset.interactiveScene = String(screenIndex);
  }

  scenes.forEach((actions,index) => {
    if (!actions) return;
    const slide=slides[index+2];
    const card=slide?.querySelector('.visual-card');
    if (!card) return;
    card.classList.add('eco-interactive-card');
    bindScene(slide,card.querySelector('.scene-visual svg'),card.querySelector('.scene-caption'),actions,index+2,index===23);
  });

  // Se conserva la bienvenida horizontal aprobada y su propósito.
  const welcome=slides[2];
  const visual=welcome?.querySelector('.audience-bridge-visual');
  if (visual) {
    visual.classList.add('eco-welcome-visual');
    const caption=document.createElement('p');

    caption.textContent='Liderar · Dialogar · Transformar.';
    visual.appendChild(caption);
    bindScene(welcome,visual.querySelector('svg'),caption,[
      node(315,220,'Liderar','Reconocer capacidades y asumir responsabilidades permite orientar decisiones ambientales de forma coherente.',53),
      node(112,300,'Dialogar','Escuchar a los actores y reconocer sus intereses abre condiciones para participar y construir acuerdos legítimos.',51),
      node(520,302,'Transformar','Aplicar herramientas de análisis y diálogo ayuda a proteger derechos, reconocer el territorio y revisar acuerdos.',51)
    ],2,false);
  }
